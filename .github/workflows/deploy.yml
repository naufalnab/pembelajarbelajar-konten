name: Build and deploy Konten

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: konten-production
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pembelajarbelajar-konten:latest
            ghcr.io/${{ github.repository_owner }}/pembelajarbelajar-konten:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy-on-server:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "Rahasia SSH belum dikonfigurasi; deployment dilewati."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Replace the running container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "Rahasia SSH belum dikonfigurasi; deployment dilewati."
            exit 0
          fi
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
            set -eu
            image='ghcr.io/naufalnab/pembelajarbelajar-konten:latest'
            docker pull "$image"
            docker rm -f pembelajarbelajar-konten >/dev/null 2>&1 || true
            docker run --detach \
              --name pembelajarbelajar-konten \
              --restart unless-stopped \
              --env NODE_ENV=production \
              --env PORT=3000 \
              --env NEXT_PUBLIC_SITE_URL=https://konten.pembelajarbelajar.com \
              --publish 3010:3000 \
              "$image"
          REMOTE
