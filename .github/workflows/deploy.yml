name: Build and deploy Konten

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: konten-production
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pembelajarbelajar-konten:latest
            ghcr.io/${{ github.repository_owner }}/pembelajarbelajar-konten:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
