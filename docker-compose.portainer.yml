services:
  konten:
    image: ghcr.io/naufalnab/pembelajarbelajar-konten:latest
    container_name: pembelajarbelajar-konten
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_SITE_URL: https://konten.pembelajarbelajar.com
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "3010:3000"

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: pembelajarbelajar-konten-updater
    restart: unless-stopped
    command: --label-enable --interval 300 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
